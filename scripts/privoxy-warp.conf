listen-address  0.0.0.0:8118
toggle  1
enable-remote-toggle  0
enable-remote-http-toggle  0
enable-edit-actions  0
enforce-blocks  0
buffer-limit  4096
keep-alive-timeout  300
socket-timeout  300

# Forward through the host proxy. The WARP container can receive Clash fake-IP
# addresses (198.18.0.0/15) that are unreachable inside Docker.
forward   /   host.docker.internal:7897
